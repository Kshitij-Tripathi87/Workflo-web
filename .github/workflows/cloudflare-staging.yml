name: Cloudflare Staging Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision staging and deploy Pages preview
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Provision or reuse Cloudflare staging resources
        run: bash scripts/cloudflare/provision-staging.sh

      - name: Apply D1 staging migrations
        run: npx --yes wrangler@4 d1 migrations apply workflo-web-staging --remote --config wrangler.jsonc

      - name: Deploy Pages preview
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name workflo-site
          --branch "${GITHUB_REF_NAME}"
          --config wrangler.jsonc

      - name: Smoke-test staging API
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_SLUG="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9-]#-#g' | sed 's#--*#-#g' | sed 's#^-##; s#-$##')"
          URL="https://${BRANCH_SLUG}.workflo-site.pages.dev"
          for attempt in $(seq 1 12); do
            if body="$(curl --fail --silent --show-error "$URL/api/v1/health")"; then
              echo "$body" | jq -e '.status == "ok" and .service == "workflo-web-api"'
              exit 0
            fi
            sleep 5
          done
          echo "Staging health check did not pass at ${URL}/api/v1/health" >&2
          exit 1
