name: Materialize Workflo redesign

on:
  push:
    branches:
      - redesign/editorial-motion-refinement
    paths:
      - design-handoff.tar.gz
      - .github/workflows/materialize-redesign.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4
        with:
          ref: redesign/editorial-motion-refinement
          persist-credentials: true

      - name: Apply the validated source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf design-handoff.tar.gz -C .
          rm design-handoff.tar.gz .github/workflows/materialize-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Workflo editorial and motion redesign"
          git push origin HEAD:refs/heads/redesign/editorial-motion-refinement
