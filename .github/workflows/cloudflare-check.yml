name: Cloudflare Functions CI

on:
  push:
    branches:
      - feat/cloudflare-pages-backend
    paths:
      - "functions/**"
      - "migrations/**"
      - "cloudflare/**"
      - "scripts/cloudflare/**"
      - ".github/workflows/cloudflare-*.yml"
  pull_request:
    paths:
      - "functions/**"
      - "migrations/**"
      - "cloudflare/**"
      - "scripts/cloudflare/**"
      - ".github/workflows/cloudflare-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Pages Functions typecheck and validation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck Pages Functions
        run: >
          npx tsc --noEmit --strict --target ES2022 --module ESNext
          --moduleResolution Bundler --lib ES2022,DOM,DOM.Iterable
          --skipLibCheck functions/_shared/*.ts functions/api/v1/*.ts
      - name: Run validation tests
        run: npx --yes tsx@4 --test functions/tests/*.test.ts
